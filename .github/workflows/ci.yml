name: Repository Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Repository Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -e

          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            ".gitignore"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi

            echo "Found: $file"
          done

      - name: Check CUDA project structure
        shell: bash
        run: |
          set -e

          projects=(
            "01. Vector Addition"
            "02. Vector Multiplication"
            "03. Matrix Addition"
            "04. Matrix Multiplication"
            "05. Parallel Reduction"
            "06. Image Blur"
            "07. Edge Detection"
            "08. Convolution"
            "09. Matrix Transpose"
            "10. CPU vs GPU Benchmark"
            "11. Device Query"
            "12. GPU Memory Bandwidth"
            "13. Parallel Histogram"
            "14. Image Histogram"
            "15. Monte Carlo Simulation"
            "16. cuBLAS Matrix Multiplication"
            "17. FFT Processing"
            "18. GPU Random Numbers"
            "19. CUDA Streams"
            "20. CUDA Graphs"
            "21. Unified Memory"
            "22. Pinned Memory"
            "23. Sparse Matrix Operations"
            "24. Linear System Solver"
            "25. GPU Image Processing Pipeline"
          )

          for project in "${projects[@]}"; do
            if [ ! -d "$project" ]; then
              echo "Missing project directory: $project"
              exit 1
            fi

            echo "Found project: $project"
          done

      - name: Check project files
        shell: bash
        run: |
          set -e

          for project in [0-9][0-9].\ *; do
            if [ ! -d "$project" ]; then
              continue
            fi

            cuda_count=$(find "$project" -maxdepth 1 -type f -name '*.cu' | wc -l)
            readme_count=$(find "$project" -maxdepth 1 -type f -name 'README.md' | wc -l)

            if [ "$cuda_count" -ne 1 ]; then
              echo "Expected exactly one .cu file in: $project"
              exit 1
            fi

            if [ "$readme_count" -ne 1 ]; then
              echo "Missing README.md in: $project"
              exit 1
            fi

            echo "Validated: $project"
          done

      - name: Check CUDA source count
        shell: bash
        run: |
          set -e

          cuda_files=$(find . -type f -name '*.cu' | wc -l)

          echo "CUDA source files found: $cuda_files"

          if [ "$cuda_files" -ne 25 ]; then
            echo "Expected exactly 25 CUDA source files."
            exit 1
          fi

      - name: Validation completed
        run: echo "Repository validation completed successfully."